apiVersion: v1
kind: Pod
metadata:
  name: synthetic-host-access
spec:
  # TESTCASE: IAC-019 Kubernetes pod shares host network and process namespaces
  hostNetwork: true
  hostPID: true
  containers:
    - name: fixture
      image: example.invalid/security-fixture:1.0
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      # TESTCASE: IAC-020 Kubernetes mounts host filesystem path
      hostPath:
        path: /
